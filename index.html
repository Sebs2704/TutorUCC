<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor UCC | Inicio de sesión</title>
    <link rel="stylesheet" href="./Styles.css">
</head>
<body>
    <main class="page-login">
        <section class="background-overlay"></section>

        <section class="login-wrapper">
            <div class="login-card">
                <div class="login-header">
    <div class="brand-top">
        <div class="campus-badge">
            <span class="badge-icon">●</span>
            <div>
                <p class="badge-title">TUTOR</p>
                <p class="badge-subtitle">UCC</p>
            </div>
        </div>

        <div class="ucc-brand">
            <img src="./Imagenes/logo-ucc.png" alt="Logo UCC" class="ucc-logo-img">
        </div>
    </div>
</div>

                <form class="login-form">
                    <div class="input-group">
                        <label for="usuario">Correo institucional</label>
                        <input 
                            type="email" 
                            id="usuario" 
                            name="usuario"
                            placeholder="usuario@campusucc.edu.co"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password"
                            placeholder="Ingresa tu contraseña"
                            required
                        >
                    </div>

                    <div class="actions">
                        <button type="submit" class="btn-login">Iniciar sesión</button>
                        <a href="#" class="forgot-link">¿Olvidó su contraseña?</a>
                    </div>
                </form>

                <div class="login-footer">
                    <p>© 2026 Tutor UCC. Todos los derechos reservados.</p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
