<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tutor UCC | Administrador</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages/admin.css" />
  <!-- Auth guard: corre sincrónicamente antes de renderizar la página -->
  <script src="js/auth-guard.js"></script>
</head>
<body>

  <!-- ══════════════════════ DASHBOARD ADMIN ══════════════════════ -->
  <div id="page-admin" class="admin-layout">

    <aside class="admin-sidebar" role="navigation" aria-label="Menú administrador">
      <div class="admin-sidebar__brand">
        <img src="image/logo-ucc.png" alt="UCC">
        <div>
          <div class="admin-sidebar__brand-text">TutorUCC</div>
          <div class="admin-sidebar__brand-sub">Administración</div>
        </div>
      </div>

      <div class="admin-sidebar__user">
        <div class="admin-sidebar__user-name" id="admin-user-name">—</div>
        <div class="admin-sidebar__user-role">Administrador TI</div>
      </div>

      <nav class="admin-nav" role="tablist">
        <button type="button" class="admin-nav__item active" data-section="overview" role="tab">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Panel general
        </button>
        <div class="admin-nav__divider"></div>
        <button type="button" class="admin-nav__item" data-section="estudiantes" role="tab">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Estudiantes
        </button>
        <button type="button" class="admin-nav__item" data-section="docentes" role="tab">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Docentes
        </button>
        <div class="admin-nav__divider"></div>
        <button type="button" class="admin-nav__item" data-section="materias" role="tab">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          Materias
        </button>
        <button type="button" class="admin-nav__item" data-section="horarios" role="tab">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Horarios
        </button>
        <div class="admin-nav__divider"></div>
        <button type="button" class="admin-nav__item" data-section="tutorias" role="tab">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          Tutorías
        </button>
      </nav>

      <a href="docs/Manual_Admin_TutorUCC.pdf" download class="admin-sidebar__logout admin-sidebar__manual" aria-label="Descargar manual de usuario">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Manual de usuario
      </a>
      <button type="button" class="admin-sidebar__logout" id="btn-logout-admin">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Cerrar sesión
      </button>
    </aside>

    <main class="admin-main" role="main">
      <div class="admin-section" data-section="overview"></div>
      <div class="admin-section" data-section="estudiantes" hidden></div>
      <div class="admin-section" data-section="docentes"    hidden></div>
      <div class="admin-section" data-section="materias"    hidden></div>
      <div class="admin-section" data-section="horarios"    hidden></div>
      <div class="admin-section" data-section="tutorias"    hidden></div>
    </main>

  </div>

  <!-- Scripts -->
  <script src="js/config.js"                 defer></script>
  <script src="js/utils/dom.js"              defer></script>
  <script src="js/utils/validators.js"       defer></script>
  <script src="js/utils/api.js"              defer></script>
  <script src="js/components/AdminComponent.js" defer></script>
  <script src="js/pages/admin-page.js"       defer></script>
</body>
</html>
